<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MediQ · Healthcare Administration</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root {
  --font: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --bg: #f8fafc;
  --card: #fff;
  --card-hover: #fcfdfe;
  --tx: #0f172a;
  --tx-sec: #475569;
  --mut: #64748b;
  --pri: #0284c7;
  --pri-dark: #0369a1;
  --pri-light: #e0f2fe;
  --cyan: #00A3FF;
  --navy: #0F2851;
  --ok: #10b981;
  --ok-bg: #ecfdf5;
  --ok-border: #a7f3d0;
  --ok-text: #065f46;
  --bad: #ef4444;
  --bad-bg: #fef2f2;
  --bad-border: #fecaca;
  --bad-text: #991b1b;
  --warn: #f59e0b;
  --warn-bg: #fffbeb;
  --warn-border: #fde68a;
  --warn-text: #92400e;
  --line: #e2e8f0;
  --input-bg: #f8fafc;
  --shadow-sm: 0 1px 2px 0 rgba(15, 23, 42, 0.05);
  --shadow-md: 0 4px 6px -1px rgba(15, 23, 42, 0.07), 0 2px 4px -2px rgba(15, 23, 42, 0.04);
  --shadow-lg: 0 10px 25px -5px rgba(15, 23, 42, 0.08), 0 8px 10px -6px rgba(15, 23, 42, 0.04);
}

@media(prefers-color-scheme:dark){
  :root {
    --bg: #0b1120;
    --card: #131d31;
    --card-hover: #18243c;
    --tx: #f8fafc;
    --tx-sec: #cbd5e1;
    --mut: #94a3b8;
    --pri: #38bdf8;
    --pri-dark: #0284c7;
    --pri-light: rgba(56, 189, 248, 0.12);
    --ok: #34d399;
    --ok-bg: rgba(16, 185, 129, 0.12);
    --ok-border: rgba(16, 185, 129, 0.3);
    --ok-text: #6ee7b7;
    --bad: #f87171;
    --bad-bg: rgba(239, 68, 68, 0.12);
    --bad-border: rgba(239, 68, 68, 0.3);
    --bad-text: #fca5a5;
    --warn: #fbbf24;
    --warn-bg: rgba(245, 158, 11, 0.12);
    --warn-border: rgba(245, 158, 11, 0.3);
    --warn-text: #fde68a;
    --line: #1e293b;
    --input-bg: #0e1726;
    --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.3);
    --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.4);
    --shadow-lg: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
  }
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--tx);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

/* Header */
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 28px;
  background: var(--card);
  border-bottom: 1px solid var(--line);
  position: sticky;
  top: 0;
  z-index: 20;
  box-shadow: var(--shadow-sm);
  backdrop-filter: blur(8px);
}
.brand-group {
  display: flex;
  align-items: center;
  gap: 12px;
}
.brand-logo-icon {
  width: 38px;
  height: 38px;
  border-radius: 10px;
  background: linear-gradient(135deg, #0f2851 0%, #0284c7 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 10px rgba(2, 132, 199, 0.25);
}
.brand-title-wrap h1 {
  font-size: 17px;
  font-weight: 800;
  letter-spacing: -0.02em;
  display: flex;
  align-items: center;
  gap: 2px;
}
.brand-title-wrap p {
  font-size: 11px;
  color: var(--mut);
  font-weight: 500;
  letter-spacing: 0.02em;
}
.brand-title-navy { color: var(--navy); }
@media(prefers-color-scheme:dark){ .brand-title-navy { color: #f8fafc; } }
.brand-title-cyan { color: var(--cyan); }

.header-actions {
  display: flex;
  align-items: center;
  gap: 14px;
}
.admin-badge {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 5px 12px;
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 99px;
  font-size: 12px;
  font-weight: 600;
}
.admin-avatar-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #10b981;
  box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.2);
}

main {
  max-width: 1200px;
  margin: 0 auto;
  padding: 24px 20px 48px;
}

/* Stats Cards */
.stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
  gap: 14px;
  margin-bottom: 24px;
}
.stat-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 16px 18px;
  box-shadow: var(--shadow-sm);
  display: flex;
  align-items: center;
  gap: 14px;
  transition: transform 0.15s ease, box-shadow 0.15s ease;
}
.stat-card:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow-md);
}
.stat-icon {
  width: 44px;
  height: 44px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  flex-shrink: 0;
}
.stat-icon.amber { background: var(--warn-bg); color: var(--warn-text); border: 1px solid var(--warn-border); }
.stat-icon.blue { background: var(--pri-light); color: var(--pri); border: 1px solid rgba(2,132,199,0.25); }
.stat-icon.green { background: var(--ok-bg); color: var(--ok-text); border: 1px solid var(--ok-border); }
.stat-icon.purple { background: rgba(147, 51, 234, 0.1); color: #9333ea; border: 1px solid rgba(147, 51, 234, 0.2); }
.stat-icon.cyan { background: rgba(0, 163, 255, 0.1); color: #0284c7; border: 1px solid rgba(0, 163, 255, 0.2); }

.stat-info b {
  display: block;
  font-size: 24px;
  font-weight: 800;
  letter-spacing: -0.02em;
  line-height: 1.1;
  color: var(--tx);
}
.stat-info span {
  font-size: 12px;
  color: var(--mut);
  font-weight: 600;
}

/* Nav Tabs */
nav.tab-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}
.tab-pills {
  display: flex;
  background: var(--card);
  padding: 4px;
  border: 1px solid var(--line);
  border-radius: 12px;
  gap: 4px;
}
.tab-pills button {
  padding: 8px 16px;
  border-radius: 9px;
  border: 0;
  font-size: 13px;
  font-weight: 600;
  background: transparent;
  color: var(--tx-sec);
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 8px;
  transition: all 0.15s ease;
}
.tab-pills button:hover {
  color: var(--tx);
}
.tab-pills button.on {
  background: var(--pri);
  color: #fff;
  box-shadow: 0 2px 6px rgba(2, 132, 199, 0.3);
}
.count-pill {
  padding: 2px 7px;
  border-radius: 99px;
  font-size: 11px;
  font-weight: 700;
}
.tab-pills button.on .count-pill {
  background: rgba(255, 255, 255, 0.25);
  color: #fff;
}
.tab-pills button:not(.on) .count-pill {
  background: var(--warn-bg);
  color: var(--warn-text);
}

.search-box {
  position: relative;
  min-width: 260px;
}
.search-box input {
  padding-left: 36px;
  font-size: 13px;
  height: 40px;
}
.search-box svg {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--mut);
  pointer-events: none;
}

/* Cards & Content */
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 16px;
  box-shadow: var(--shadow-sm);
}

/* Button & Form Elements */
button, input, select, textarea { font-family: inherit; font-size: 13px; }
button {
  border: 0;
  border-radius: 9px;
  padding: 8px 16px;
  cursor: pointer;
  background: var(--pri);
  color: #fff;
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: all 0.15s ease;
}
button:hover { filter: brightness(1.05); transform: translateY(-1px); }
button:active { transform: translateY(0); }
button.sec {
  background: var(--card);
  color: var(--tx-sec);
  border: 1px solid var(--line);
}
button.sec:hover {
  background: var(--bg);
  color: var(--tx);
  border-color: #cbd5e1;
}
button.sec.on {
  background: var(--pri-light);
  color: var(--pri);
  border-color: rgba(2, 132, 199, 0.3);
}
button.ok {
  background: linear-gradient(180deg, #10b981 0%, #059669 100%);
  color: #fff;
  box-shadow: 0 2px 6px rgba(16, 185, 129, 0.25);
}
button.bad {
  background: linear-gradient(180deg, #ef4444 0%, #dc2626 100%);
  color: #fff;
  box-shadow: 0 2px 6px rgba(239, 68, 68, 0.25);
}
button.warn {
  background: linear-gradient(180deg, #f59e0b 0%, #d97706 100%);
  color: #fff;
}

input, select, textarea {
  padding: 10px 13px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: var(--input-bg);
  color: var(--tx);
  width: 100%;
  transition: border-color 0.15s, box-shadow 0.15s;
}
input:focus, select:focus, textarea:focus {
  outline: none;
  border-color: var(--pri);
  box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
}

.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.grow { flex: 1; }

/* Status Badges */
.tag {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 3px 10px;
  border-radius: 99px;
  font-size: 11px;
  font-weight: 700;
  text-transform: capitalize;
  letter-spacing: 0.02em;
}
.tag.pending { background: var(--warn-bg); color: var(--warn-text); border: 1px solid var(--warn-border); }
.tag.approved { background: var(--ok-bg); color: var(--ok-text); border: 1px solid var(--ok-border); }
.tag.rejected { background: var(--bad-bg); color: var(--bad-text); border: 1px solid var(--bad-border); }
.tag.doctor { background: rgba(2,132,199,0.1); color: var(--pri); border: 1px solid rgba(2,132,199,0.25); }
.tag.receptionist { background: rgba(147,51,234,0.1); color: #9333ea; border: 1px solid rgba(147,51,234,0.25); }
.tag.patient { background: var(--bg); color: var(--tx-sec); border: 1px solid var(--line); }
.tag.admin { background: #0f172a; color: #f8fafc; border: 1px solid #334155; }

/* Key-Value Details */
.kv {
  display: grid;
  grid-template-columns: 140px 1fr;
  gap: 6px 14px;
  margin: 12px 0;
  font-size: 13px;
}
.kv dt { color: var(--mut); font-weight: 500; }
.kv dd { margin: 0; color: var(--tx); word-break: break-word; font-weight: 600; }

.imgs { display: flex; gap: 10px; overflow-x: auto; margin: 12px 0; padding-bottom: 4px; }
.imgs img {
  height: 96px;
  border-radius: 10px;
  border: 1px solid var(--line);
  object-fit: cover;
  transition: transform 0.15s;
}
.imgs img:hover { transform: scale(1.03); }

/* Table Styling */
table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; }
th, td { text-align: left; padding: 12px 14px; border-bottom: 1px solid var(--line); }
th { color: var(--mut); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; background: var(--card); }
tr:last-child td { border-bottom: 0; }
tr:hover td { background: var(--card-hover); }

/* Empty state */
.empty-box {
  text-align: center;
  padding: 48px 20px;
  color: var(--mut);
}
.empty-box svg {
  width: 48px;
  height: 48px;
  margin-bottom: 12px;
  stroke: var(--mut);
  opacity: 0.5;
}

/* Modal Dialog */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(15, 23, 42, 0.6);
  backdrop-filter: blur(4px);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 100;
  padding: 16px;
  animation: fadeIn 0.15s ease-out;
}
.modal-box {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 18px;
  max-width: 480px;
  width: 100%;
  padding: 24px;
  box-shadow: var(--shadow-lg);
  animation: popIn 0.2s cubic-bezier(0.16, 1, 0.3, 1);
}
.modal-title { font-size: 17px; font-weight: 700; margin-bottom: 6px; }
.modal-sub { font-size: 13px; color: var(--mut); margin-bottom: 16px; }
.quick-reasons { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 16px; }
.chip-reason {
  font-size: 12px;
  padding: 4px 10px;
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 99px;
  cursor: pointer;
  font-weight: 500;
}
.chip-reason:hover { border-color: var(--pri); color: var(--pri); }
.modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }

/* Toast */
.toast-msg {
  position: fixed;
  bottom: 24px;
  right: 24px;
  background: #0f172a;
  color: #fff;
  padding: 12px 20px;
  border-radius: 12px;
  font-size: 13px;
  font-weight: 600;
  box-shadow: var(--shadow-lg);
  display: flex;
  align-items: center;
  gap: 10px;
  z-index: 200;
  animation: slideUp 0.25s cubic-bezier(0.16, 1, 0.3, 1);
}

/* Login Page Styles */
.login-wrap {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px 16px;
  background: radial-gradient(circle at 50% 15%, rgba(2, 132, 199, 0.08), transparent 60%), var(--bg);
}
.login-card {
  width: 100%;
  max-width: 420px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 22px;
  padding: 36px 32px;
  box-shadow: var(--shadow-lg);
}
.login-header { text-align: center; margin-bottom: 26px; }
.login-icon-box {
  width: 62px;
  height: 62px;
  margin: 0 auto 16px;
  border-radius: 18px;
  background: linear-gradient(135deg, #0f2851 0%, #0284c7 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 10px 22px -4px rgba(2, 132, 199, 0.4);
}
.login-title { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; margin: 0 0 6px; }
.login-subtitle { font-size: 13px; color: var(--mut); margin: 0; }
.form-group { margin-bottom: 18px; }
.form-label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
.btn-submit {
  width: 100%;
  padding: 13px;
  border: 0;
  border-radius: 11px;
  background: linear-gradient(180deg, #0284c7 0%, #0369a1 100%);
  color: #fff;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  box-shadow: 0 4px 14px rgba(2, 132, 199, 0.35);
  justify-content: center;
}
.alert-error {
  background: var(--bad-bg);
  border: 1px solid var(--bad-border);
  color: var(--bad-text);
  border-radius: 10px;
  padding: 11px 14px;
  font-size: 13px;
  margin-bottom: 18px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.login-footer {
  margin-top: 24px;
  text-align: center;
  font-size: 12px;
  color: var(--mut);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}

@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes popIn { from { transform: scale(0.96); opacity: 0; } to { transform: scale(1); opacity: 1; } }
@keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
</style>
</head>
<body>
<div id="app"></div>

<script>
const $ = (s, r=document) => r.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let sb, me, tab = 'apps', appFilter = 'pending', userFilter = 'all', searchQuery = '';
let currentCfg = null;
let cachedApps = [], cachedHospitals = [], cachedUsers = [];

// MediQ Logo SVG
const MEDIQ_LOGO_SVG = `
<svg width="26" height="26" viewBox="0 0 64 64" fill="none">
  <circle cx="28" cy="28" r="20" stroke="#00A3FF" stroke-width="6" stroke-linecap="round"/>
  <line x1="43" y1="43" x2="56" y2="56" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
  <rect x="25" y="16" width="6" height="24" rx="3" fill="#ffffff"/>
  <rect x="16" y="25" width="24" height="6" rx="3" fill="#ffffff"/>
</svg>`;

function toast(msg, isErr=false){
  const old = document.querySelector('.toast-msg');
  if(old) old.remove();
  const el = document.createElement('div');
  el.className = 'toast-msg';
  el.innerHTML = `<span>${isErr ? '⚠️' : '✓'}</span><span>${esc(msg)}</span>`;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 3200);
}

async function resolveConfig(){
  for (const endpoint of ['/api/config', 'api/config', './api/config']) {
    try {
      const res = await fetch(endpoint);
      if(res.ok){
        const data = await res.json();
        if(data && data.url && data.key && data.key.length >= 20){
          return { url: data.url, key: data.key, fromEnv: true };
        }
      }
    } catch(e){}
  }
  try {
    const stored = JSON.parse(localStorage.getItem('mediq_admin_cfg') || 'null');
    if(stored && stored.url && stored.key) return stored;
  } catch(e){}

  const defUrl = 'https://ouddhqorzshmuumywxhl.supabase.co';
  const defKey = 'sb_publishable_ORH7iwG_EtWxES-wZtcmsA_1WmLYaAZ';
  if(defUrl && defKey) return { url: defUrl, key: defKey, isDefault: true };
  return null;
}

// ---------- boot ----------
(async function(){
  currentCfg = await resolveConfig();
  if(!currentCfg) return showConfig();
  sb = supabase.createClient(currentCfg.url, currentCfg.key);
  const { data } = await sb.auth.getSession();
  if(data && data.session) return enter();
  showLogin();
})();

function showConfig(msg){
  $('#app').innerHTML = `
    <div class="login-wrap">
      <div class="login-card">
        <div class="login-header">
          <div class="login-icon-box">${MEDIQ_LOGO_SVG}</div>
          <h2 class="login-title">Connect Backend</h2>
          <p class="login-subtitle">Supabase Connection Settings</p>
        </div>
        ${msg ? `<div class="alert-error"><div>${esc(msg)}</div></div>` : ''}
        <div class="form-group">
          <label class="form-label">Project URL</label>
          <input id="u" placeholder="https://xxxx.supabase.co" value="https://ouddhqorzshmuumywxhl.supabase.co">
        </div>
        <div class="form-group">
          <label class="form-label">Anon / Public API Key</label>
          <input id="k" placeholder="sb_publishable_..." value="sb_publishable_ORH7iwG_EtWxES-wZtcmsA_1WmLYaAZ">
        </div>
        <button id="go" class="btn-submit">Save Connection</button>
      </div>
    </div>`;
  $('#go').onclick = () => {
    const url = $('#u').value.trim(), key = $('#k').value.trim();
    if(!/^https:\/\/.+\.supabase\.co\/?$/.test(url) || key.length < 20) return showConfig('Check URL and key format.');
    localStorage.setItem('mediq_admin_cfg', JSON.stringify({url, key})); location.reload();
  };
}

function showLogin(msg){
  $('#app').innerHTML = `
    <div class="login-wrap">
      <div class="login-card">
        <div class="login-header">
          <div class="login-icon-box">${MEDIQ_LOGO_SVG}</div>
          <h2 class="login-title">
            <span class="brand-title-navy">Medi</span><span class="brand-title-cyan">Q</span> Admin
          </h2>
          <p class="login-subtitle">Healthcare Verification & Operations Portal</p>
        </div>

        ${msg ? `<div class="alert-error">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
          <div>${esc(msg)}</div>
        </div>` : ''}

        <form id="loginForm" autocomplete="on">
          <div class="form-group">
            <label class="form-label" for="e">Administrator Email</label>
            <input id="e" class="form-input" type="email" placeholder="admin@mediq.com" required autofocus autocomplete="email">
          </div>
          <div class="form-group">
            <label class="form-label" for="p">Master Password</label>
            <input id="p" class="form-input" type="password" placeholder="••••••••••••" required autocomplete="current-password">
          </div>
          <button id="go" type="submit" class="btn-submit">Sign In to Dashboard</button>
        </form>

        <div class="login-footer">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
          <span>Authorized administrative access only</span>
        </div>
      </div>
    </div>`;

  const form = $('#loginForm');
  const btn = $('#go');
  form.onsubmit = async (e) => {
    e.preventDefault();
    const email = $('#e').value.trim();
    const password = $('#p').value;
    if(!email || !password) return;
    btn.disabled = true;
    btn.textContent = 'Authenticating…';
    try {
      const { error } = await sb.auth.signInWithPassword({ email, password });
      if(error){
        showLogin(error.message);
      } else {
        enter();
      }
    } catch(err) {
      showLogin(err.message || 'Connection error. Please try again.');
    }
  };
}

async function enter(){
  const { data: { user } } = await sb.auth.getUser();
  const { data: prof } = await sb.from('profiles').select('full_name,role').eq('id', user.id).single();
  if(!prof || prof.role !== 'admin'){ await sb.auth.signOut(); return showLogin('This account does not have administrator privileges.'); }
  me = prof; render();
}

// ---------- shell ----------
async function render(){
  $('#app').innerHTML = `
    <header>
      <div class="brand-group">
        <div class="brand-logo-icon">${MEDIQ_LOGO_SVG}</div>
        <div class="brand-title-wrap">
          <h1>
            <span class="brand-title-navy">Medi</span><span class="brand-title-cyan">Q</span>
            <span style="font-size:13px;font-weight:700;color:var(--mut);margin-left:4px;">ADMIN</span>
          </h1>
          <p>Operations & Verification Portal</p>
        </div>
      </div>
      <div class="header-actions">
        <div class="admin-badge">
          <div class="admin-avatar-dot"></div>
          <span>${esc(me.full_name || 'Admin')}</span>
        </div>
        <button class="sec" id="out" style="padding:7px 12px;font-size:12px;">Sign out</button>
      </div>
    </header>

    <main>
      <div class="stats" id="stats">
        <div class="stat-card" style="opacity:0.6"><div class="stat-info"><b>…</b><span>Loading metrics</span></div></div>
      </div>

      <nav class="tab-bar">
        <div class="tab-pills">
          <button class="${tab==='apps'?'on':''}" data-t="apps">
            <span>📋 Applications</span>
            <span class="count-pill" id="badgePendingApps" style="display:none;">0</span>
          </button>
          <button class="${tab==='hosp'?'on':''}" data-t="hosp">
            <span>🏥 Hospitals</span>
          </button>
          <button class="${tab==='users'?'on':''}" data-t="users">
            <span>👥 Users</span>
          </button>
        </div>

        <div class="search-box">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <input id="globalSearch" placeholder="Search records by name, email, city..." value="${esc(searchQuery)}">
        </div>
      </nav>

      <div id="view">
        <div class="empty-box"><p>Loading records…</p></div>
      </div>
    </main>`;

  $('#out').onclick = async () => { await sb.auth.signOut(); location.reload(); };
  document.querySelectorAll('nav.tab-bar .tab-pills button').forEach(b => b.onclick = () => { tab = b.dataset.t; render(); });
  
  const searchInput = $('#globalSearch');
  if(searchInput){
    searchInput.oninput = (e) => {
      searchQuery = e.target.value.toLowerCase();
      if(tab === 'apps') renderAppsList();
      else if(tab === 'hosp') renderHospitalsList();
      else if(tab === 'users') renderUsersList();
    };
  }

  loadStats();
  ({apps: viewApps, hosp: viewHospitals, users: viewUsers})[tab]();
}

async function loadStats(){
  const cnt = async (t, f) => { let q = sb.from(t).select('*', {count:'exact', head:true}); if(f) q = f(q); const {count} = await q; return count ?? 0; };
  const [pend, hosp, hpend, pat, staff] = await Promise.all([
    cnt('staff_applications', q => q.eq('status','pending')),
    cnt('hospitals', q => q.eq('status','approved')),
    cnt('hospitals', q => q.eq('status','pending')),
    cnt('profiles', q => q.eq('role','patient')),
    cnt('profiles', q => q.in('role',['doctor','receptionist']))
  ]);

  const badge = $('#badgePendingApps');
  if(badge && pend > 0){
    badge.textContent = pend;
    badge.style.display = 'inline-block';
  }

  $('#stats').innerHTML = `
    <div class="stat-card">
      <div class="stat-icon amber">⏳</div>
      <div class="stat-info"><b>${pend}</b><span>Pending Staff</span></div>
    </div>
    <div class="stat-card">
      <div class="stat-icon purple">🏥</div>
      <div class="stat-info"><b>${hpend}</b><span>Pending Hospitals</span></div>
    </div>
    <div class="stat-card">
      <div class="stat-icon green">🏢</div>
      <div class="stat-info"><b>${hosp}</b><span>Live Hospitals</span></div>
    </div>
    <div class="stat-card">
      <div class="stat-icon blue">🩺</div>
      <div class="stat-info"><b>${staff}</b><span>Medical Staff</span></div>
    </div>
    <div class="stat-card">
      <div class="stat-icon cyan">👥</div>
      <div class="stat-info"><b>${pat}</b><span>Patients</span></div>
    </div>`;
}

// ---------- applications ----------
async function viewApps(){
  const { data, error } = await sb.from('staff_applications')
    .select('*, applicant:profiles!user_id(full_name,email,phone), hospitals(*)').order('created_at', {ascending:false});
  if(error) return $('#view').innerHTML = `<div class="card alert-error">${esc(error.message)} — has sql/07 been run?</div>`;
  cachedApps = data || [];
  renderAppsList();
}

function renderAppsList(){
  let list = cachedApps.filter(a => appFilter === 'all' || a.status === appFilter);
  if(searchQuery){
    list = list.filter(a => {
      const p = a.applicant || {}, h = a.hospitals || {};
      const haystack = [p.full_name, p.email, p.phone, a.specialty, a.license_number, h.name, h.city].filter(Boolean).join(' ').toLowerCase();
      return haystack.includes(searchQuery);
    });
  }

  $('#view').innerHTML = `
    <div class="row" style="margin-bottom:14px">
      ${['pending','approved','rejected','all'].map(s =>
        `<button class="sec ${appFilter===s?'on':''}" data-f="${s}" style="text-transform:capitalize;">${s}</button>`).join('')}
      <span class="muted" style="margin-left:auto;font-size:12px;">Showing ${list.length} application${list.length===1?'':'s'}</span>
    </div>
    ${list.length ? list.map(appCard).join('') : `
      <div class="card empty-box">
        <svg viewBox="0 0 24 24" fill="none"><path d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <p>No applications match the current filter.</p>
      </div>`}`;

  document.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { appFilter = b.dataset.f; renderAppsList(); });
  document.querySelectorAll('[data-approve]').forEach(b => b.onclick = () => decide(b.dataset.approve, true));
  document.querySelectorAll('[data-reject]').forEach(b => b.onclick = () => openRejectModal(b.dataset.reject));
}

function kv(pairs){
  return '<dl class="kv">' + pairs.filter(p => p[1] !== null && p[1] !== undefined && p[1] !== '')
    .map(([k,v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('') + '</dl>';
}

function appCard(a){
  const p = a.applicant || {}, h = a.hospitals || {};
  const imgs = (h.image_urls || []).filter(u => /^https:\/\//.test(u)).map(u => `<img src="${esc(u)}" alt="Hospital photo">`).join('');
  const isPending = a.status === 'pending';

  return `
    <div class="card" style="border-left: 4px solid ${a.status==='approved'?'var(--ok)':a.status==='rejected'?'var(--bad)':'var(--warn)'}">
      <div class="row" style="margin-bottom:8px;">
        <div class="grow">
          <h3 style="font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px;">
            <span>${esc(p.full_name || 'Unnamed Applicant')}</span>
            <span class="tag ${esc(a.requested_role)}">${esc(a.requested_role)}</span>
          </h3>
        </div>
        <span class="tag ${esc(a.status)}">${esc(a.status)}</span>
      </div>

      ${kv([
        ['Email', p.email],
        ['Phone', p.phone],
        ['Applied on', new Date(a.created_at).toLocaleString()],
        ['License Number', a.license_number],
        ['Specialty', a.specialty],
        ['Experience', a.experience_years ? a.experience_years + ' Years' : ''],
        ['Consultation Fee', a.consultation_fee ? '₹' + a.consultation_fee : ''],
        ['Qualification', a.qualification],
        ['Bio', a.bio],
        ['Rejection Reason', a.rejection_reason]
      ])}

      <div style="margin-top:14px;padding-top:14px;border-top:1px dashed var(--line);">
        <p style="font-size:13px;font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:6px;">
          <span>${a.is_new_hospital ? '🆕 Registration for New Hospital' : '🏥 Affiliated Hospital'}:</span>
          <span style="color:var(--pri);">${esc(h.name || '—')}</span>
        </p>
        ${a.is_new_hospital ? kv([
          ['Hospital Type', h.type],
          ['Full Address', [h.address, h.city, h.state].filter(Boolean).join(', ')],
          ['Contact Phone', h.phone],
          ['Hospital Email', h.email],
          ['Registration No.', h.registration_number],
          ['Hours of Operation', h.opening_hours],
          ['Bed Capacity', h.bed_count ? h.bed_count + ' Beds' : ''],
          ['24x7 Emergency', h.emergency_24x7 ? 'Yes' : 'No'],
          ['Facilities', (h.facilities || []).join(', ')],
          ['Description', h.description]
        ]) + (imgs ? `<div class="imgs">${imgs}</div>` : '<p class="muted" style="font-size:12px;margin:6px 0;">No hospital photos uploaded.</p>') : ''}
      </div>

      ${isPending ? `
        <div class="row" style="margin-top:18px;padding-top:12px;border-top:1px solid var(--line);">
          <button class="ok" data-approve="${esc(a.id)}">✓ Approve Application</button>
          <button class="bad" data-reject="${esc(a.id)}">✕ Reject with Reason…</button>
        </div>` : ''}
    </div>`;
}

// Modal for rejection
function openRejectModal(id){
  const old = document.querySelector('.modal-overlay');
  if(old) old.remove();

  const modal = document.createElement('div');
  modal.className = 'modal-overlay';
  modal.innerHTML = `
    <div class="modal-box">
      <h3 class="modal-title">Reject Staff Application</h3>
      <p class="modal-sub">Please specify a reason. This explanation will be displayed directly to the applicant.</p>

      <div class="quick-reasons">
        <span class="chip-reason" onclick="$('#rejectReasonText').value=this.textContent">Medical registration unverified</span>
        <span class="chip-reason" onclick="$('#rejectReasonText').value=this.textContent">Hospital address invalid</span>
        <span class="chip-reason" onclick="$('#rejectReasonText').value=this.textContent">Duplicate application</span>
        <span class="chip-reason" onclick="$('#rejectReasonText').value=this.textContent">Incomplete credentials</span>
      </div>

      <textarea id="rejectReasonText" rows="3" placeholder="Enter reason shown to applicant..." autofocus></textarea>

      <div class="modal-actions">
        <button class="sec" id="btnCancelReject">Cancel</button>
        <button class="bad" id="btnConfirmReject">Confirm Rejection</button>
      </div>
    </div>`;

  document.body.appendChild(modal);
  $('#btnCancelReject').onclick = () => modal.remove();
  $('#btnConfirmReject').onclick = async () => {
    const reason = $('#rejectReasonText').value.trim();
    if(!reason){ alert('Please enter a rejection reason.'); return; }
    modal.remove();
    decide(id, false, reason);
  };
}

async function decide(id, approve, reason=null){
  let res;
  if(approve){
    if(!confirm('Approve this staff application? The user will immediately receive staff privileges.')) return;
    res = await sb.rpc('approve_staff_application', { p_application_id: id });
  } else {
    res = await sb.rpc('reject_staff_application', { p_application_id: id, p_reason: reason });
  }

  if(res.error || res.data?.success === false){
    toast(res.error?.message || res.data?.error || 'Action failed', true);
  } else {
    toast(approve ? 'Application approved successfully! ✨' : 'Application marked as rejected.');
  }
  loadStats();
  viewApps();
}

// ---------- hospitals ----------
async function viewHospitals(){
  const { data, error } = await sb.from('hospitals')
    .select('id,name,city,status,active,rating,review_count,image_url,phone,emergency_24x7')
    .order('created_at', {ascending:false});
  if(error) return $('#view').innerHTML = `<div class="card alert-error">${esc(error.message)}</div>`;
  cachedHospitals = data || [];
  renderHospitalsList();
}

function renderHospitalsList(){
  let list = cachedHospitals;
  if(searchQuery){
    list = list.filter(h => {
      const haystack = [h.name, h.city, h.phone, h.status].filter(Boolean).join(' ').toLowerCase();
      return haystack.includes(searchQuery);
    });
  }

  $('#view').innerHTML = `
    <div class="card" style="padding:0;overflow:hidden;">
      <div style="overflow-x:auto;">
        <table>
          <thead>
            <tr>
              <th style="width:64px;"></th>
              <th>Hospital</th>
              <th>City</th>
              <th>Status</th>
              <th>Rating</th>
              <th style="text-align:right;">Actions</th>
            </tr>
          </thead>
          <tbody>
            ${list.length ? list.map(h => `
              <tr>
                <td>
                  ${h.image_url && /^https:/.test(h.image_url) 
                    ? `<img src="${esc(h.image_url)}" width="50" height="38" style="object-fit:cover;border-radius:8px;border:1px solid var(--line);" alt="">` 
                    : `<div style="width:50px;height:38px;border-radius:8px;background:var(--bg);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:18px;">🏥</div>`}
                </td>
                <td>
                  <b style="font-size:14px;">${esc(h.name)}</b><br>
                  <span class="muted" style="font-size:12px;">${esc(h.phone || '')}${h.emergency_24x7 ? ' · <span style="color:#ef4444;font-weight:700;">24x7 ER</span>' : ''}</span>
                </td>
                <td><span style="font-weight:600;">${esc(h.city || '—')}</span></td>
                <td><span class="tag ${esc(h.status)}">${esc(h.status)}</span></td>
                <td>${h.rating ? '★ ' + esc(h.rating) + ' <span class="muted">(' + esc(h.review_count) + ')</span>' : '<span class="muted">—</span>'}</td>
                <td style="text-align:right;">
                  <div class="row" style="justify-content:flex-end;">
                    ${h.status !== 'approved' 
                      ? `<button class="ok" style="padding:5px 12px;font-size:12px;" data-hs="approved" data-id="${esc(h.id)}">Approve</button>` 
                      : `<button class="sec" style="padding:5px 12px;font-size:12px;" data-hs="rejected" data-id="${esc(h.id)}">Suspend</button>`}
                    ${h.status === 'pending' 
                      ? `<button class="bad" style="padding:5px 12px;font-size:12px;" data-hs="rejected" data-id="${esc(h.id)}">Reject</button>` 
                      : ''}
                  </div>
                </td>
              </tr>`).join('') : `
              <tr><td colspan="6" class="empty-box">No hospitals match the search filter.</td></tr>`}
          </tbody>
        </table>
      </div>
    </div>`;

  document.querySelectorAll('[data-hs]').forEach(b => b.onclick = async () => {
    const action = b.dataset.hs;
    if(!confirm(`Are you sure you want to mark this hospital as ${action}?`)) return;
    const { data: r, error: e } = await sb.rpc('admin_set_hospital_status', { p_hospital_id: b.dataset.id, p_status: action });
    if(e || r?.success === false){
      toast(e?.message || r?.error || 'Action failed', true);
    } else {
      toast(`Hospital status updated to ${action}! ✨`);
    }
    loadStats();
    viewHospitals();
  });
}

// ---------- users ----------
async function viewUsers(){
  let q = sb.from('profiles').select('full_name,email,phone,role,requested_role,created_at').order('created_at', {ascending:false}).limit(300);
  if(userFilter !== 'all') q = q.eq('role', userFilter);
  const { data, error } = await q;
  if(error) return $('#view').innerHTML = `<div class="card alert-error">${esc(error.message)}</div>`;
  cachedUsers = data || [];
  renderUsersList();
}

function renderUsersList(){
  let list = cachedUsers;
  if(searchQuery){
    list = list.filter(u => {
      const haystack = [u.full_name, u.email, u.phone, u.role, u.requested_role].filter(Boolean).join(' ').toLowerCase();
      return haystack.includes(searchQuery);
    });
  }

  $('#view').innerHTML = `
    <div class="row" style="margin-bottom:14px">
      ${['all','patient','doctor','receptionist','admin'].map(r =>
        `<button class="sec ${userFilter===r?'on':''}" data-r="${r}" style="text-transform:capitalize;">${r}</button>`).join('')}
      <span class="muted" style="margin-left:auto;font-size:12px;">Showing ${list.length} user${list.length===1?'':'s'}</span>
    </div>

    <div class="card" style="padding:0;overflow:hidden;">
      <div style="overflow-x:auto;">
        <table>
          <thead>
            <tr>
              <th>User</th>
              <th>Email</th>
              <th>Phone</th>
              <th>Assigned Role</th>
              <th>Joined Date</th>
            </tr>
          </thead>
          <tbody>
            ${list.length ? list.map(u => {
              const initials = (u.full_name || 'U').split(' ').map(n=>n[0]).slice(0,2).join('').toUpperCase();
              return `
              <tr>
                <td>
                  <div class="row" style="gap:10px;">
                    <div style="width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg, #0284c7, #0f2851);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;">${esc(initials)}</div>
                    <div>
                      <b style="font-size:13px;">${esc(u.full_name || 'Unnamed')}</b>
                    </div>
                  </div>
                </td>
                <td><span style="color:var(--tx-sec);">${esc(u.email || '—')}</span></td>
                <td><span style="color:var(--tx-sec);">${esc(u.phone || '—')}</span></td>
                <td>
                  <span class="tag ${esc(u.role)}">${esc(u.role)}</span>
                  ${u.role !== u.requested_role && u.requested_role && u.requested_role !== 'patient' 
                    ? `<span class="muted" style="font-size:11px;margin-left:4px;">(Requested: ${esc(u.requested_role)})</span>` 
                    : ''}
                </td>
                <td><span style="color:var(--mut);">${new Date(u.created_at).toLocaleDateString()}</span></td>
              </tr>`;
            }).join('') : `
              <tr><td colspan="5" class="empty-box">No users found for this filter.</td></tr>`}
          </tbody>
        </table>
      </div>
    </div>`;

  document.querySelectorAll('[data-r]').forEach(b => b.onclick = () => { userFilter = b.dataset.r; viewUsers(); });
}
</script>
</body>
</html>
